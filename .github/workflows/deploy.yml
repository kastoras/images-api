# Two-stage deploy: staging first, then production behind a manual approval.
#
# Staging runs on the self-hosted runner on z2-stage, because that Portainer is
# never published — the runner uses host networking and reaches it over
# localhost:9443. Production Portainer is internet-reachable, so that job runs
# on a GitHub-hosted runner.
#
# The approval gate is the `environment: production` protection rule, which
# pauses the job until a required reviewer approves. That is why both stages are
# jobs in one workflow rather than two workflow files — splitting them would
# lose the pause-and-approve UX and the shared image tag.
#
# NOTE: on a workflow_run event, actions/checkout checks out the DEFAULT BRANCH,
# not the release tag. The compose files are therefore always read from main —
# land compose changes on main before cutting a release.
name: Deploy

on:
  workflow_run:
    workflows: ["Build & Push"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (commit SHA, or 'latest'). Use an older SHA to roll back."
        required: true
        default: latest

env:
  # workflow_run carries the SHA that was built; workflow_dispatch takes it from input.
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}

jobs:
  staging:
    name: Deploy to staging
    runs-on: [self-hosted, z2-stage]
    environment: staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy staging stack
        uses: ./.github/actions/portainer-deploy
        with:
          portainer-url: ${{ secrets.PORTAINER_URL }}
          portainer-token: ${{ secrets.PORTAINER_TOKEN }}
          portainer-endpoint-id: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          portainer-stack-name: ${{ secrets.PORTAINER_STACK_NAME }}
          portainer-insecure: ${{ vars.PORTAINER_INSECURE }}
          compose-file: docker-compose.staging.yml
          image-tag: ${{ env.IMAGE_TAG }}
          dockerhub-namespace: ${{ vars.IMAGES_API_DOCKERHUB_NAMESPACE }}
          api-token: ${{ secrets.IMAGES_API_API_TOKEN }}
          redis-password: ${{ secrets.IMAGES_API_REDIS_PASSWORD }}
          s3-access-key: ${{ secrets.IMAGES_API_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.IMAGES_API_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.IMAGES_API_S3_ENDPOINT }}
          s3-region: ${{ vars.IMAGES_API_S3_REGION }}
          s3-bucket: ${{ vars.IMAGES_API_S3_BUCKET }}
          s3-use-path-style: ${{ vars.IMAGES_API_S3_USE_PATH_STYLE }}
          authentication-type: ${{ vars.IMAGES_API_AUTHENTICATION_TYPE }}
          log-level: ${{ vars.IMAGES_API_LOG_LEVEL }}
          max-workers: ${{ vars.IMAGES_API_MAX_WORKERS }}
          max-queue-depth: ${{ vars.IMAGES_API_MAX_QUEUE_DEPTH }}
          processing-timeout: ${{ vars.IMAGES_API_PROCESSING_TIMEOUT }}
          traefik-host: ${{ vars.IMAGES_API_HOST }}

  production:
    name: Deploy to production
    needs: staging
    runs-on: ubuntu-latest
    # Approval gate: configure required reviewers on the `production` environment.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy production stack
        uses: ./.github/actions/portainer-deploy
        with:
          portainer-url: ${{ secrets.PORTAINER_URL }}
          portainer-token: ${{ secrets.PORTAINER_TOKEN }}
          portainer-endpoint-id: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          portainer-stack-name: ${{ secrets.PORTAINER_STACK_NAME }}
          portainer-insecure: ${{ vars.PORTAINER_INSECURE }}
          compose-file: docker-compose.prod.yml
          image-tag: ${{ env.IMAGE_TAG }}
          dockerhub-namespace: ${{ vars.IMAGES_API_DOCKERHUB_NAMESPACE }}
          api-token: ${{ secrets.IMAGES_API_API_TOKEN }}
          redis-password: ${{ secrets.IMAGES_API_REDIS_PASSWORD }}
          s3-access-key: ${{ secrets.IMAGES_API_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.IMAGES_API_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.IMAGES_API_S3_ENDPOINT }}
          s3-region: ${{ vars.IMAGES_API_S3_REGION }}
          s3-bucket: ${{ vars.IMAGES_API_S3_BUCKET }}
          s3-use-path-style: ${{ vars.IMAGES_API_S3_USE_PATH_STYLE }}
          authentication-type: ${{ vars.IMAGES_API_AUTHENTICATION_TYPE }}
          log-level: ${{ vars.IMAGES_API_LOG_LEVEL }}
          max-workers: ${{ vars.IMAGES_API_MAX_WORKERS }}
          max-queue-depth: ${{ vars.IMAGES_API_MAX_QUEUE_DEPTH }}
          processing-timeout: ${{ vars.IMAGES_API_PROCESSING_TIMEOUT }}
          host-port: ${{ vars.IMAGES_API_HOST_PORT }}
