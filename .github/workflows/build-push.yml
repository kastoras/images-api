# Builds the production image and publishes it to Docker Hub, then tells the
# private ops repo to deploy it.
#
# Deployment does not live here. This repo is public, and staging's Portainer is
# unpublished, so deploying it needs a self-hosted runner — which must never
# serve a public repo, or a fork PR would run on that LAN. The workflows, the
# composite action and the Swarm compose files all moved to the private
# kastoras/services-ops, reached below via repository_dispatch.
name: Build & Push

on:
  workflow_dispatch:
  release:
    types:
      - created

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DockerHub namespace
        id: dockerhub_namespace
        env:
          DOCKERHUB_NAMESPACE_RAW: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          DOCKERHUB_NAMESPACE=$(echo "$DOCKERHUB_NAMESPACE_RAW" | tr '[:upper:]' '[:lower:]' | xargs)

          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "DOCKERHUB_NAMESPACE secret is empty."
            exit 1
          fi

          if ! [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "DOCKERHUB_NAMESPACE must be a plain DockerHub username/org (lowercase letters, digits, ., _, -)."
            exit 1
          fi

          echo "namespace=$DOCKERHUB_NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single-arch amd64 on purpose: the Dockerfile hard-codes GOARCH=amd64.
      # Building multi-arch would need that removed first.
      - name: Build and push images-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: final
          push: true
          tags: |
            ${{ steps.dockerhub_namespace.outputs.namespace }}/images-api:latest
            ${{ steps.dockerhub_namespace.outputs.namespace }}/images-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.dockerhub_namespace.outputs.namespace }}/images-api:latest
          cache-to: type=inline

      # Hands the immutable :<sha> tag to kastoras/services-ops, which deploys it
      # to staging. The repository guard keeps forks from firing at infrastructure
      # they do not own. OPS_DISPATCH_TOKEN is a fine-grained PAT scoped to
      # services-ops alone, with Contents: Read and write — the only permission
      # the dispatches endpoint needs.
      - name: Trigger staging deploy
        if: github.repository == 'kastoras/images-api'
        env:
          OPS_DISPATCH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${OPS_DISPATCH_TOKEN:-}" ]; then
            echo "OPS_DISPATCH_TOKEN is unset — skipping dispatch."
            echo "The image is published; deploy it by running the staging workflow in services-ops by hand."
            exit 0
          fi

          # jq builds the body so the tag is never spliced into a string.
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $OPS_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kastoras/services-ops/dispatches \
            -d "$(jq -nc --arg tag "$IMAGE_TAG" \
                    '{event_type: "images-api-built", client_payload: {image_tag: $tag}}')"

          echo "Dispatched images-api-built to kastoras/services-ops with tag $IMAGE_TAG."

      - name: Summary
        run: |
          echo "Pushed ${{ steps.dockerhub_namespace.outputs.namespace }}/images-api:latest"
          echo "Pushed ${{ steps.dockerhub_namespace.outputs.namespace }}/images-api:${{ github.sha }}"
