# Staging stack for z2-stage — single-node Docker Swarm, deployed by
# .github/workflows/deploy.yml through the Portainer API.
#
# Swarm, not plain Compose: `restart:` and `depends_on:` are IGNORED here, so
# restart behaviour lives under `deploy.restart_policy` and there is no startup
# ordering. Traefik labels must sit under `deploy.labels`, not the top-level
# `labels`.
#
# Nothing publishes a host port. Ingress is Traefik + Cloudflare Tunnel, and
# UFW does not filter Docker-published ports, so publishing here would quietly
# expose the service on the LAN.
#
# Every ${VAR} is supplied by the Portainer stack env, rebuilt on each deploy
# from GitHub environment secrets/variables. Adding one here means adding it to
# .github/actions/portainer-deploy/action.yml too.

services:
  images-api:
    image: ${IMAGES_API_DOCKERHUB_NAMESPACE}/images-api:${IMAGES_API_IMAGE_TAG}
    environment:
      API_PORT: "8080"
      LOG_LEVEL: ${IMAGES_API_LOG_LEVEL}
      READ_TIMEOUT: "15"
      WRITE_TIMEOUT: "15"
      IDLE_TIMEOUT: "60"

      AUTHENTICATION_TYPE: ${IMAGES_API_AUTHENTICATION_TYPE}
      API_TOKEN: ${IMAGES_API_API_TOKEN}

      REDIS_ENABLED: "true"
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${IMAGES_API_REDIS_PASSWORD}

      # S3_ENDPOINT, S3_ACCESS_KEY and S3_SECRET_KEY must be non-empty or the
      # process exits 1 at startup — config.Load() treats "unset with an empty
      # default" as fatal (internal/config/config.go:82-105), even when
      # S3_ENABLED is false.
      S3_ENABLED: "true"
      S3_ENDPOINT: ${IMAGES_API_S3_ENDPOINT}
      S3_REGION: ${IMAGES_API_S3_REGION}
      S3_BUCKET: ${IMAGES_API_S3_BUCKET}
      S3_ACCESS_KEY: ${IMAGES_API_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${IMAGES_API_S3_SECRET_KEY}
      S3_USE_PATH_STYLE: ${IMAGES_API_S3_USE_PATH_STYLE}

      MAX_WORKERS: ${IMAGES_API_MAX_WORKERS}
      MAX_QUEUE_DEPTH: ${IMAGES_API_MAX_QUEUE_DEPTH}
      PROCESSING_TIMEOUT: ${IMAGES_API_PROCESSING_TIMEOUT}
    networks:
      - internal
      - traefik-public
    # No healthcheck: the final image is distroless/static — no shell, no curl,
    # no wget, so any probe fails. /health is unauthenticated; monitor it
    # through Traefik or an external uptime check instead.
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.images-api.rule=Host(`${IMAGES_API_HOST}`)"
        # Set IMAGES_API_TRAEFIK_ENTRYPOINT to `web` if the Cloudflare Tunnel
        # terminates TLS and Traefik listens plaintext behind it.
        - "traefik.http.routers.images-api.entrypoints=${IMAGES_API_TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.services.images-api.loadbalancer.server.port=8080"

  redis:
    image: redis:8.8.0-alpine
    command: redis-server --requirepass ${IMAGES_API_REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${IMAGES_API_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      # Pins the volume to one node, so the data does not vanish if the swarm
      # ever grows past a single node.
      placement:
        constraints:
          - node.role == manager

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${IMAGES_API_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${IMAGES_API_S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  # One-shot: creates the bucket, then exits. Required — ObjectStorage.Ping()
  # (internal/server/object_storage.go:46) calls HeadBucket, so a missing bucket
  # reads as "S3 unreachable" and the app permanently disables storage. Nothing
  # in the application creates it.
  minio-init:
    image: minio/mc:latest
    environment:
      MC_ACCESS_KEY: ${IMAGES_API_S3_ACCESS_KEY}
      MC_SECRET_KEY: ${IMAGES_API_S3_SECRET_KEY}
      MC_BUCKET: ${IMAGES_API_S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set staging http://minio:9000 "$$MC_ACCESS_KEY" "$$MC_SECRET_KEY" >/dev/null 2>&1; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --ignore-existing "staging/$$MC_BUCKET"
        echo "bucket $$MC_BUCKET ready"
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: none

volumes:
  redis-data:
  minio-data:

networks:
  internal:
    driver: overlay
  # Created outside this stack; Traefik attaches to it to route traffic in.
  traefik-public:
    external: true
