services:
  images-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: dev
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - images-api-network
      - wedbuddy-shared

  redis:
    image: redis:8.8.0-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - images-api-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - images-api-network

networks:
  images-api-network:
    driver: bridge
  wedbuddy-shared:
    external: true
